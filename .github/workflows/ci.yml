name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the repository toolchain
        run: rustup show active-toolchain
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml') }}
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked
      - name: Build
        run: cargo build --locked
      - name: Verify terminal and recording workflows
        run: python3 scripts/check-terminal.py

  postgres:
    name: PostgreSQL ${{ matrix.postgres }} integration
    strategy:
      fail-fast: false
      matrix:
        postgres: [16, 17, 18]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PGTRAIL_POSTGRES_VERSION: ${{ matrix.postgres }}
      COMPOSE_PROJECT_NAME: pgtrail-ci-${{ matrix.postgres }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Start PostgreSQL
        run: docker compose up -d --wait
      - name: Verify monitoring privileges
        run: sh scripts/check-db.sh
      - name: Install the repository toolchain
        run: rustup show active-toolchain
      - name: Test the collector against PostgreSQL ${{ matrix.postgres }}
        env:
          PGTRAIL_LIVE_TEST: "1"
        run: cargo test --locked --lib -- --ignored --test-threads=1
      - name: Show database logs on failure
        if: failure()
        run: docker compose logs postgres
      - name: Stop PostgreSQL
        if: always()
        run: docker compose down --volumes
