services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: pgtrail_admin
      POSTGRES_DB: pgtrail_dev
      POSTGRES_PASSWORD: ${PGTRAIL_ADMIN_PASSWORD:-pgtrail-local-admin}
      PGTRAIL_MONITOR_PASSWORD: ${PGTRAIL_MONITOR_PASSWORD:-pgtrail-local-monitor}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - compute_query_id=on
    ports:
      - "127.0.0.1:${PGTRAIL_POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./dev/postgres/init.sh:/docker-entrypoint-initdb.d/10-pgtrail.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U pgtrail_admin -d pgtrail_dev"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  postgres-data:
