[package]
name = "pgtrail"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
description = "A terminal tool for PostgreSQL diagnostics and snapshot comparison"
repository = "https://github.com/gregorsternat/pgtrail"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await"] }
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
tokio = { version = "1", features = ["macros", "rt", "signal"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
