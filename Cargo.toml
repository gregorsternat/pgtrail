[package]
name = "pgtrail"
version = "1.0.0"
edition = "2024"
rust-version = "1.98.1"
description = "A terminal tool for PostgreSQL diagnostics and snapshot comparison"
repository = "https://github.com/gregorsternat/pgtrail"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
crossterm = { version = "0.29", features = ["event-stream"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await"] }
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-native-roots", "postgres", "sqlite-bundled", "chrono"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt", "signal", "time", "sync", "fs"] }
url = "2"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
